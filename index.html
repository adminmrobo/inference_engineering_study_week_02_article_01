*{box-sizing:border-box}

h1{font-size:clamp(30px,5vw,52px);line-height:1.2;margin:.2em 0 .3em;text-wrap:balance}

a{color:var(--info)}

.band canvas{position:absolute;inset:0;width:100%;height:100%;opacity:.55}
.band .wrap{position:relative;padding-block:44px 36px}
.eyebrow{font-size:13px;letter-spacing:.06em;color:var(--gfp)}
.lead{font-size:18px;max-width:62ch;color:#d8d6e6}

.cast figure{margin:0;background:rgba(28,30,45,.85);border:1px solid var(--rule);border-radius:12px;padding:10px;text-align:center;min-width:0}
.cast img{width:96px;height:96px;object-fit:contain}
.cast b{display:block;font-size:15px}
.cast span{display:block;font-size:13px;color:var(--muted);line-height:1.4}
main{padding-block:40px 64px}
.eps{display:grid;gap:16px}

.ep .thumb{display:block;border-radius:10px;overflow:hidden;border:1px solid var(--rule);aspect-ratio:3/2;background:var(--panel2)}
.ep .thumb img{display:block;width:100%;height:100%;object-fit:cover}
.ep .no{display:inline-flex;align-items:center;justify-content:center;width:40px;height:44px;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:var(--panel2);color:var(--gfp);font-weight:700;margin-right:10px;vertical-align:middle}

.ep h3 a{color:var(--text);text-decoration:none}.ep h3 a:hover{text-decoration:underline}
.ep p{margin:.6em 0;color:#d8d6e6}

.tags span{font-size:12.5px;border:1px solid var(--rule);border-radius:999px;padding:1px 10px;color:var(--muted)}
.tags span:last-child{color:var(--c-robo);border-color:rgba(87,208,220,.45)}
.go{display:inline-block;background:var(--gfp);color:#10251a;font-weight:700;text-decoration:none;border-radius:8px;padding:6px 16px;margin-right:10px}

.langs a{text-decoration:none;border:1px solid var(--rule);border-radius:6px;padding:1px 8px;color:var(--text)}
.langs a[aria-current]{border-color:var(--gfp);color:var(--gfp)}
.ep.soon{display:block;border-style:dashed;color:var(--muted);text-align:center;padding:22px}
footer{border-top:1px solid var(--rule);padding-block:24px 40px;color:var(--muted);font-size:14px}

(function(){
  var ok={}; D.langs.forEach(function(l){ok[l]=1});
  function pick(){var q=null; try{q=new URLSearchParams(location.search).get('lang')}catch(e){}
    if(q&&ok[q])return q;
    var nav=(navigator.languages||[navigator.language||'']).map(function(x){return String(x).slice(0,2).toLowerCase()});
    for(var i=0;i<nav.length;i++){ if(ok[nav[i]])return nav[i]; } return 'ko';}
  function file(ep,l){return ep.file+(l==='ko'?'':'.'+l)+'.html'}
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  var sel=document.getElementById('langSel');
  D.langs.forEach(function(l){var o=document.createElement('option');o.value=l;o.textContent=D.native[l];sel.appendChild(o);});
  function render(L){var U=D.ui[L]; document.documentElement.lang=L; document.title=U.title; sel.value=L; sel.setAttribute('aria-label',U.lang);
    document.getElementById('tSeries').textContent=U.series; document.getElementById('tTitle').textContent=U.series;
    document.getElementById('tLead').textContent=U.lead; document.getElementById('tCast').textContent=U.cast;
    document.getElementById('tList').textContent=U.list; document.getElementById('tBy').textContent=U.by;
    var who=['doc','asst','fly','robo'], img=['doc_e08','asst_e13','fly_e10','robo_e13'];
    document.getElementById('cast').innerHTML=who.map(function(w,i){return '<figure><img src="'+SPR[img[i]]+'" alt="" aria-hidden="true" width="96" height="96"><b style="color:var(--c-'+w+')">'+esc(D.names[L][i])+'</b><span>'+esc(U.roles[i])+'</span></figure>'}).join('');
    document.getElementById('eps').innerHTML=D.eps.map(function(ep){var href=file(ep,L)+'?lang='+L;
      return '<article class="ep"><a class="thumb" href="'+href+'"><img src="'+ep.thumb+'" width="400" height="267" loading="lazy" alt="'+esc(U.alt)+'"></a><div>'+
        '<span class="no">'+ep.no+'</span><h3><a href="'+href+'">'+esc(ep.title[L])+'</a></h3>'+
        '<div class="tags">'+U.tags.map(function(t){return '<span>'+esc(t)+'</span>'}).join('')+'</div>'+
        '<p>'+esc(ep.desc[L])+'</p><p class="cite">'+esc(ep.cite)+'</p>'+
        '<a class="go" href="'+href+'">'+esc(U.open)+' →</a>'+
        '<span class="langs">'+esc(U.also)+': '+D.langs.map(function(l){return '<a href="'+file(ep,l)+'?lang='+l+'" hreflang="'+l+'"'+(l===L?' aria-current="true"':'')+'>'+D.native[l]+'</a>'}).join('')+'</span></div></article>'}).join('')+
      '<div class="ep soon">'+esc(U.soon)+'</div>';}

  render(pick());
  var cv=document.getElementById('honey');
  function honey(){var r=cv.getBoundingClientRect(),d=window.devicePixelRatio||1; cv.width=r.width*d; cv.height=r.height*d; var x=cv.getContext('2d'); x.setTransform(d,0,0,d,0,0);
    x.strokeStyle='rgba(157,155,184,.14)'; var s=14,dx=s*Math.sqrt(3),dy=s*1.5;
    for(var y=0,row=0;y<r.height+s;y+=dy,row++)for(var X=(row%2?dx/2:0);X<r.width+dx;X+=dx){x.beginPath();for(var k=0;k<6;k++){var a=Math.PI/3*k+Math.PI/6;x.lineTo(X+s*Math.cos(a),y+s*Math.sin(a));}x.closePath();x.stroke();}}
  honey(); window.addEventListener('resize',honey);
})();
